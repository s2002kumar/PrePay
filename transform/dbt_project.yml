name: prepay
version: "1.0.0"
config-version: 2
profile: prepay

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Last performance month covered by the locked release (YYYY-MM). Set by `prepay transform`
  # from configs/data.lock.json; never derived from the system clock.
  performance_cutoff: "2026-06"
  # MODELING §2: a terminal 01 within this many months of contractual maturity is maturity, not
  # a voluntary prepayment.
  maturity_window_months: 2
  # Burnout counts months whose note-minus-market incentive exceeds this threshold.
  burnout_threshold_bps: 50
  # Freddie Mac accounting-cycle transition months kept flagged (MODELING §5).
  accounting_transition_months: ["2019-05", "2025-10"]

models:
  prepay:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

tests:
  prepay:
    +severity: error
