# Builds the public static demo (fictional pools, synthetic-trained model) and deploys it to
# GitHub Pages. The build checks every precomputed response against the live API, and the e2e
# step checks that the static site shows the same numbers as the live app. After the deploy, the
# verify job checks the published site in a browser. Synthetic only.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked environments
        run: |
          make setup
          cd web && npm ci --ignore-scripts
      - name: Build the fictional demo bundle (dev preset, the public demo's world)
        run: uv run --frozen prepay --log-level WARNING demo build --out build/demo --preset dev
      - name: Measure API latency and memory on this runner (informational)
        run: uv run --frozen prepay --log-level WARNING demo latency --bundle build/demo
      - name: Build the live web UI (the reference for the parity tests)
        run: cd web && npx vite build
      - name: Build the static site (every response checked against the API)
        run: make static-site
      - name: Install Chromium for Playwright
        run: cd web && npx playwright install --with-deps chromium
      - name: Static site against the live app, navigation and accessibility
        run: cd web && PREPAY_STATIC_SITE=../build/pages-site npx playwright test --project static
      - name: Publication gate on the site
        run: uv run --frozen prepay --log-level WARNING publication-check --tree pages=build/pages-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages-site/PrePay

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The build job tested these bytes on a local server; this checks the published site itself.
  verify:
    name: verify deployed site
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the locked web environment and Chromium
        run: |
          cd web && npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Every scenario, deep links, navigation and accessibility on the published site
        env:
          PREPAY_DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: cd web && npx playwright test --project deployed
