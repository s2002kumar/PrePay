# Public CI: synthetic, deterministic and offline once dependencies are installed.
# No secrets are used; no real mortgage data ever enters this workflow.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install locked environment
        run: make setup
      - name: Lint, type-check and test (make check)
        run: make check
      - name: Finance suite with coverage gate
        run: make test-finance

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the publication gate's credential scan
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked environments
        run: |
          make setup
          cd web && npm ci --ignore-scripts
      - name: Build the fictional demo bundle (full pipeline through the sealed lockbox)
        run: uv run --frozen prepay --log-level WARNING demo build --out build/demo --preset ci
      - name: Build the web UI
        run: cd web && npx vite build
      - name: Install Chromium for Playwright
        run: cd web && npx playwright install --with-deps chromium
      - name: Browser end-to-end and accessibility tests
        run: cd web && npx playwright test --project desktop
      - name: Publication gate (tracked files, history, web build, demo bundle)
        run: uv run --frozen prepay --log-level WARNING publication-check --history --tree web=web/dist --tree demo=build/demo
      - name: Upload Playwright report on failure (fictional data only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
