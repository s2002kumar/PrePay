[project]
name = "prepay"
version = "0.1.0"
description = "Mortgage cash-flow intelligence: competing-risk payoff models and an audited pool cash-flow engine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sandeep Kumar" }]
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.1",
    "pyarrow>=18",
]

[project.scripts]
prepay = "prepay.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prepay"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "C4", "DTZ",
    "PT", "NPY", "S", "T20", "PERF", "PGH", "TID", "PIE", "RET", "ARG",
]
ignore = [
    "S101",   # assert is idiomatic in tests and for internal invariants guarded by explicit errors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = "src"
packages = ["prepay"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# pyarrow ships no type information; its values are treated as Any at our thin I/O boundary.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "slow: long-running deterministic tests (still synthetic and offline)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["prepay"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
