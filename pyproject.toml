[project]
name = "prepay"
version = "0.1.0"
description = "Mortgage cash-flow intelligence: competing-risk payoff models and an audited pool cash-flow engine."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sandeep Kumar" }]
dependencies = [
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "numpy>=2.1",
    "pyarrow>=18",
    "scikit-learn>=1.5",
]

[project.scripts]
prepay = "prepay.cli:main"

[dependency-groups]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "sqlfluff>=4.0",
]
transform = [
    "dbt-core>=1.12",
    "dbt-duckdb>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prepay"]

[tool.uv]
default-groups = ["dev", "transform", "api"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "C4", "DTZ",
    "PT", "NPY", "S", "T20", "PERF", "PGH", "TID", "PIE", "RET", "ARG",
]
ignore = [
    "S101",   # assert is idiomatic in tests and for internal invariants guarded by explicit errors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = "src"
packages = ["prepay"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# dbt's in-process Python API is untyped; every call into it is confined to this module.
module = ["prepay.transform"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# pyarrow, scikit-learn and SciPy ship no type information; treated as Any at call sites.
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "scipy", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "slow: long-running deterministic tests (still synthetic and offline)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["prepay"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
